# Search evaluation set for the owner's real data (pranav2@gmail.com).
#
# expected: file names (case-insensitive, exact) of the relevant sources.
#           Any listed file counts as relevant; order does not matter.
# modality: the main kind of evidence (documentation only; scoring uses all).
# negative: true -> the query should return NO results.
#
# Run: venv\Scripts\python scripts\eval_search.py

queries:

  # ---------------- documents: names, topics, natural language ----------------
  - query: java
    modality: document
    expected: [Coursera JAVA.pdf, Coursera Object Oriented Programming in Java.pdf, ANimal kingdom java.docx]

  - query: jva notes                       # typo
    modality: document
    expected: [Coursera JAVA.pdf, Coursera Object Oriented Programming in Java.pdf, ANimal kingdom java.docx]

  - query: "java!!!@#$%"                   # punctuation noise
    modality: document
    expected: [Coursera JAVA.pdf, Coursera Object Oriented Programming in Java.pdf, ANimal kingdom java.docx]







  - query: fee collection 57500            # numbers
    modality: document
    expected: [TCS iON Fee Collection 57500.pdf, Self Service 57500.pdf]

  - query: academic calendar 2024-25       # year
    modality: document
    expected: [B-Tech First Year Academic Calendar AY 2024-25.pdf]





  - query: Apple financial report
    modality: document
    expected: [Financial Report Apple Inc.docx]


  - query: Find my government documents    # from the original audit
    modality: document
    expected: [ADHAR.pdf]

  - query: aadhaar government id           # scanned ID card (Phase 5 OCR fix)
    modality: document
    expected: [ADHAR.pdf]

  # ---------------- code (GitHub) ----------------
  - query: train model
    modality: code
    expected: [train_model.py]

  - query: chrome extension manifest
    modality: code
    expected: [manifest.json]

  - query: merge datasets
    modality: code
    expected: [merge_datasets.py]

  # ---------------- images ----------------
  - query: tiger
    modality: image
    expected: [tiger-looking-with-open-mouth_1150-18083.avif]

  - query: hall ticket
    modality: image
    expected: [Hall ticket.jpeg]

  - query: golden retriever dog
    modality: image
    expected: [Golden_Retriever.webp]

  - query: pizza
    modality: image
    expected: [delicious-pepperoni-pizza-culinary-delight_632498-24206.avif]

  - query: coffee
    modality: image
    expected: [latte-coffee_1122-2728.avif]

  - query: motorcycle
    modality: image
    expected: [royalenfield-hunter-350-retro-factory1727790756803.webp]

  # ---------------- audio ----------------
  - query: climate change speech
    modality: audio
    expected: [5 Minute Speech - Action on Climate Change - 10 August 2021 - Gladys Liu MP.mp3]

  - query: gender equality
    modality: audio
    expected: [ENGLISH SPEECH  EMMA WATSON Gender Equality (English Subtitles) - English Speeches.mp3]

  # ---------------- video ----------------
  - query: forest bathing
    modality: video
    expected: [vidssave.com Forest Bathing _ Shinrin-Yoku _ Healing in Nature _ Short Documentary 720P.mp4]

  - query: brain behaves differently in nature   # transcript phrase
    modality: video
    expected: [vidssave.com Forest Bathing _ Shinrin-Yoku _ Healing in Nature _ Short Documentary 720P.mp4]

  - query: cute baby animals
    modality: video
    expected: [vidssave.com 7 Minutes of The Cutest Baby Animals You've Ever Seen _ Nat Geo 720p.mp4]

  - query: data centers in space
    modality: video
    expected: [vidssave.com How Data Centers in Space Could Change AI 480P.mp4]

  # ---------------- VISUAL-ONLY images (Phase 5, bug #3) ----------------
  # No query word appears in any expected file name: only CLIP can find these.
  - {query: dog, modality: image, visual: true, expected: [Golden_Retriever.webp]}
  - {query: big cat, modality: image, visual: true, expected: [tiger-looking-with-open-mouth_1150-18083.avif, image-asset.jpeg]}
  - {query: kitten lying on the floor, modality: image, visual: true, expected: [image-asset.jpeg]}
  - {query: dessert, modality: image, visual: true, expected: [delicious-raspberry-chocolate-ice-cream-sundae_632498-24987.avif]}
  - {query: motorbike, modality: image, visual: true, expected: [royalenfield-hunter-350-retro-factory1727790756803.webp]}
  - {query: sports car on a road, modality: image, visual: true, expected: [0x0.webp]}
  - {query: washing machine, modality: image, visual: true, expected: [nxjziQPmnp7FlSsP.webp]}
  - {query: sand dunes, modality: image, visual: true, expected: [photo-1473580044384-7ba9967e16a0.avif, desert-variety-example-wadi-rum.webp]}
  - {query: river flowing through mountains, modality: image, visual: true, expected: [photo-1624807136278-e2973be118ff.avif]}
  - {query: temple, modality: image, visual: true, expected: [photo-1715876722520-02ccc9248dab.avif]}
  - {query: sunset, modality: image, visual: true, expected: [QKOPUFKJMVV7JE2YNBCV2FILFQ.webp, photo-1715876722520-02ccc9248dab.avif]}
  - {query: passenger vehicle, modality: image, visual: true, expected: [image-bus-isolated-on-white-600nw-2578467983.webp]}
  - {query: aircraft, modality: image, visual: true, expected: [helicopter-art-design-vector-luxury-260nw-2481556627.webp]}
  - {query: sacred hindu sign, modality: image, visual: true, expected: [flat-design-om-symbol_23-2149276113.avif]}
  - {query: food, modality: image, visual: true, expected: [delicious-pepperoni-pizza-culinary-delight_632498-24206.avif, delicious-raspberry-chocolate-ice-cream-sundae_632498-24987.avif, latte-coffee_1122-2728.avif]}
  - {query: hot drink in a cup, modality: image, visual: true, expected: [latte-coffee_1122-2728.avif]}

  # visual negatives: objects absent from every image
  - {query: elephant, negative: true, visual: true}
  - {query: laptop keyboard, negative: true, visual: true}
  - {query: soccer ball, negative: true, visual: true}

  # ---------------- CODE, semantic-only (Phase 6, A1) ----------------
  # Descriptions of what a code file does; no query word matches its path.
  # Reported as their own subset: MiniLM is weak on code (see phase6-code-gate.md).
  - {query: shortest path algorithm on a weighted network, modality: code, code: true, expected: [useDijkstra.ts]}
  - {query: equipment upkeep scheduling for company property, modality: code, code: true, expected: [maintenance_service.py]}
  - {query: move equipment from one team to another, modality: code, code: true, expected: [transfer_service.py]}
  - {query: reserve a room or resource for a time slot, modality: code, code: true, expected: [booking_service.py]}
  - {query: api key and project identifier for the cloud database, modality: code, code: true, expected: [firebase-config.js]}
  - {query: browser toolbar window showing if a product review is genuine, modality: code, code: true, expected: [popup.js]}
  - {query: traffic jam forecast, modality: code, code: true, expected: [predict-congestion.ts]}
  - {query: turn the edge list text into nodes and links, modality: code, code: true, expected: [graphParser.ts]}
  - {query: noisy or combination of semantic filename and content signals, modality: code, code: true, expected: [ranking.py]}
  - {query: issue an access token when a user signs in, modality: code, code: true, expected: [auth.py]}
  - {query: write vectors and remove stale chunks, modality: code, code: true, expected: [index_store.py]}
  - {query: synthetic fake reviews from a language model, modality: code, code: true, expected: [generate_ai_reviews.py]}
  - {query: fit a classifier that detects fake reviews, modality: code, code: true, expected: [train_model.py]}
  - {query: record who changed which asset and when, modality: code, code: true, expected: [audit_service.py]}

  # ---------------- negatives: should return nothing ----------------
  - query: xqzv wplk qqq
    negative: true

  - query: submarine volcano eruption
    negative: true

  - query: kubernetes helm chart deployment
    negative: true

  - query: basketball tournament scores
    negative: true

  - query: zzzzzz
    negative: true

  - query: quarterly tax return form 1040
    negative: true

