name: Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, migrations, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cogniseek
          POSTGRES_PASSWORD: cogniseek
          POSTGRES_DB: cogniseek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cogniseek -d cogniseek"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports: ["6333:6333"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://cogniseek:cogniseek@localhost:5432/cogniseek
      PRELOAD_MODELS: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-linux.lock
            requirements-test.txt
            requirements.in

      - name: System libraries (OpenCV, Poppler, ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0 libgomp1 poppler-utils ffmpeg

      - name: Install (CPU torch + the Linux lock + test tools)
        run: |
          TORCH_VERSION="$(sed -n 's/^torch==\([0-9.]*\).*/\1/p' requirements.in)"
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}" torchvision torchaudio
          pip freeze | grep -E '^(torch|torchvision|torchaudio)==' > /tmp/torch-constraints.txt
          pip install -c /tmp/torch-constraints.txt -r backend/requirements-linux.lock -r requirements-test.txt

      - name: Ruff
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: mypy (no new errors over mypy-baseline.txt)
        run: python scripts/check_mypy_baseline.py

      - name: Migrations (upgrade head on a fresh database, then autogenerate check)
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Tests (fake models, in-memory Qdrant, a throwaway test database)
        run: python -m pytest -q -p no:cacheprovider --cov=app --cov-report=xml --cov-report=term

      - name: Startup against the real services (/health and /ready)
        env:
          ENV: development
          QDRANT_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          COGNISEEK_DISABLE_WORKER: "1"
        run: |
          python -m uvicorn app.main:app --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ready; then echo; exit 0; fi
            sleep 2
          done
          cat uvicorn.log; exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
