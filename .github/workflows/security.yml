name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC: new advisories for unchanged code

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # .gitleaksignore holds the fingerprint of one fake test JWT (see the file).
          ./gitleaks git --redact --no-banner --verbose .

  dependencies:
    name: pip-audit + npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Python (fails on HIGH/CRITICAL not in security/audit-allowlist.json)
        run: python scripts/audit_python.py
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: npm (fails on HIGH/CRITICAL)
        working-directory: frontend
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      # Uploading results to code scanning needs a public repo (or GitHub Advanced Security).
      # On a private repo the analysis still runs and fails on errors, but the SARIF is kept
      # as a workflow artifact instead of being uploaded (see docs/SECURITY.md).
      - name: Repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          echo "private=${private}" >> "$GITHUB_OUTPUT"
          if [ "$private" = "true" ]; then echo "::notice::Private repository: CodeQL results kept as an artifact, not uploaded."; fi
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ steps.visibility.outputs.private == 'true' && 'never' || 'always' }}
          output: codeql-results
      - name: Keep the SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results
          if-no-files-found: ignore
          retention-days: 30
