version: 2
updates:
  # Python: Dependabot reads requirements.in (direct runtime pins) and requirements-test.txt.
  # Not managed by Dependabot (regenerated by hand, see docs/SECURITY.md):
  # - backend/requirements-linux.lock: a resolved lock Dependabot cannot parse;
  # - requirements.txt / requirements-dev.txt: the Windows CUDA freeze (PyTorch CUDA index);
  # - requirements-gpu.txt: Paddle's CUDA index, which Dependabot cannot query.
  # ML/core bumps (torch, transformers, sentence-transformers, open_clip, faster-whisper,
  # paddle*, pillow, qdrant-client, fastapi, sqlalchemy) need the eval guardrail and the
  # indexing benchmark before merging (docs/EVALUATION.md).
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements.txt
      - requirements-dev.txt
      - requirements-gpu.txt
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/caddy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
