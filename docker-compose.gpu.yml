# NVIDIA GPU variant of the backend (needs the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Builds torch from the CUDA 12.8 index and reserves one GPU for the backend.
services:
  backend:
    build:
      args:
        TORCH_VARIANT: cu128
    image: cogniseek-backend:cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
