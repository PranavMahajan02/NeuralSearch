[pytest]
testpaths = tests
# Defence in depth: never collect the ad-hoc legacy scripts or vendored trees.
norecursedirs = scripts PaddleOCR venv paddle_env florence_env frontend data backups temp temp_frames credentials .git
markers =
    slow: imports the full app (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
    ignore:Payload indexes have no effect in the local Qdrant:UserWarning
